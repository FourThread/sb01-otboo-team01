# 기존 CI 워크플로우 최적화 (테스트 및 빌드 시간 단축)
name: Test & Coverage

on:
  push:
    branches: [ main, develop, 'release*' ]
  pull_request:
    branches: [ main, develop, 'release*' ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -sSf http://localhost:9200"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_PROFILES_ACTIVE: test
      # Gradle 데몬 비활성화로 메모리 사용량 최적화
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
      TZ: Asia/Seoul
      JAVA_OPTS: -Duser.timezone=Asia/Seoul
      KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
      WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
      REDIS_HOST: ${{secrets.REDIS_HOST}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set timezone to KST
        run: |
          sudo timedatectl set-timezone Asia/Seoul
          echo "Current time: $(date)"

      # JDK 설정 최적화 (캐시 활용)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      # Gradle 의존성 캐시 최적화
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 병렬 테스트 실행으로 시간 단축
      - name: Run tests with coverage
        run: |
          echo "=== Starting optimized test execution ==="
          echo "Gradle options: $GRADLE_OPTS"
          echo "=================================="
          # 병렬 테스트 실행 및 커버리지 생성
          ./gradlew clean testAll jacocoRootReport --parallel --build-cache
        env:
          TZ: Asia/Seoul
          JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul

      # 테스트 결과 업로드 최적화 (필수 파일만)
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            **/build/reports/tests/test/
            **/build/reports/jacoco/test/
            build/reports/jacoco/jacocoRootReport/
          retention-days: 3
          compression-level: 6

      # 코드 커버리지 업로드
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            ./build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml
            ./ozang-app/build/reports/jacoco/test/jacocoTestReport.xml
            ./ozang-batch/build/reports/jacoco/test/jacocoTestReport.xml
            ./ozang-core/build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false
          verbose: false

      # 빌드 검증 (테스트 제외)
      - name: Verify build
        run: |
          echo "=== Verifying build without tests ==="
          ./gradlew buildAll -x test --parallel --build-cache
          echo "Build verification completed"

  # 코드 품질 검사 (별도 잡으로 분리하여 병렬 실행)
  quality-check:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Run quality checks
        run: |
          ./gradlew qualityCheck --parallel
          echo "Code quality check completed"