name: CD - Deploy To ECS

on:
  push:
    branches: [ 'release*', 'release-*' ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment (bypass cache)'
        required: false
        default: 'false'
        type: boolean

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: public.ecr.aws/o8x2e2q0
  ECR_REPOSITORY: ozang-app
  ECS_SERVICE: ozang-service
  ECS_CLUSTER: ozang-cluster2
  ECS_TASK_DEFINITION: .aws/task-definition.json
  CONTAINER_NAME: ozang-app
  JAVA_OPTS: "-Xmx1024m -Xms512m -XX:MaxMetaspaceSize=256m -XX:MetaspaceSize=128m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseCompressedOops -XX:+UseCompressedClassPointers -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heapdump.hprof -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=25.0"
  SPRING_PROFILES_ACTIVE: "prod"
  ALB_DNS: "ozang-alb-1134583714.ap-northeast-2.elb.amazonaws.com"

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.extract_version.outputs.VERSION }}
      image_uri: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Extract Version from build.gradle
        id: extract_version
        run: |
          VERSION=$(grep "version = " build.gradle | sed "s/version = '\(.*\)'/\1/")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build JAR (Skip Test)
        run: ./gradlew clean build -x test --no-daemon --quiet

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR Public
        id: login-ecr
        run: |
          aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
          echo "registry=public.ecr.aws/o8x2e2q0" >> $GITHUB_OUTPUT
          echo "Successfully logged in to Public ECR"

      - name: Check for existing image in Public ECR
        id: check-image
        if: github.event.inputs.force_deploy != 'true'
        continue-on-error: true
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr-public describe-images \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-ids imageTag=${IMAGE_TAG} \
            --region us-east-1 > /dev/null 2>&1; then
            echo "image_exists=true" >> $GITHUB_OUTPUT
            echo "IMAGE EXISTS: ${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          else
            echo "image_exists=false" >> $GITHUB_OUTPUT
            echo "🔨 IMAGE NOT FOUND: Building new image"
          fi

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        if: steps.check-image.outputs.image_exists != 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image for t3.small deployment"
          echo "Build environment: GitHub Actions (sufficient resources)"
          echo "Target platform: linux/amd64"
          
          CACHE_FLAG=""
          if [ "${{ github.event.inputs.force_deploy }}" = "true" ]; then
            CACHE_FLAG="--no-cache"
            echo "Force deploy enabled: Building without cache"
          else
            echo "Using build cache for faster build"
          fi
          
          docker build \
            --build-arg VERSION=${{ env.VERSION }} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VCS_REF=${{ github.sha }} \
            --platform linux/amd64 \
            --progress=plain \
            ${CACHE_FLAG} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.VERSION }} \
            --label "instance-type=t3.small" \
            --label "git-commit=${{ github.sha }}" \
            --label "version=${{ env.VERSION }}" \
            --label "build-date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            .
          
          echo "Pushing images to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.VERSION }}
          
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          
          # 이미지 크기 및 정보 확인
          IMAGE_SIZE=$(docker images $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG --format "{{.Size}}")
          echo "Built image size: ${IMAGE_SIZE}"
          echo "Image tags:"
          echo "  - $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "  - $ECR_REGISTRY/$ECR_REPOSITORY:latest" 
          echo "  - $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.VERSION }}"

      - name: Use existing image from Public ECR
        id: use-existing-image
        if: steps.check-image.outputs.image_exists == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "image=${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Using existing image: ${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"

      - name: Set final image URI
        id: final-image
        run: |
          IMAGE_URI="${{ steps.build-image.outputs.image || steps.use-existing-image.outputs.image }}"
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "Final image URI: $IMAGE_URI"

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 25
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version from build job
        run: |
          echo "VERSION=${{ needs.build-and-push.outputs.version }}" >> $GITHUB_ENV
          echo "Version: ${{ needs.build-and-push.outputs.version }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get current deployment state
        id: current-state
        run: |
          echo "Checking current ECS state..."
          
          # 현재 태스크 정의 ARN 저장 (롤백용)
          CURRENT_TASK_DEF=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "current_task_def=${CURRENT_TASK_DEF}" >> $GITHUB_OUTPUT
          echo "Current task definition: ${CURRENT_TASK_DEF}"
          
          # 현재 실행 중인 태스크 수 저장
          CURRENT_DESIRED_COUNT=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].desiredCount' \
            --output text)
          echo "current_desired_count=${CURRENT_DESIRED_COUNT}" >> $GITHUB_OUTPUT
          echo "Current desired count: ${CURRENT_DESIRED_COUNT}"

      - name: Update Task Definition with Environment Variables
        run: |
          echo "Updating task definition with environment variables..."
          
          cat ${{ env.ECS_TASK_DEFINITION }} | jq --arg java_opts "${{ env.JAVA_OPTS }}" \
            --arg profile "${{ env.SPRING_PROFILES_ACTIVE }}" \
            --arg version "${{ env.VERSION }}" \
            --arg instance_type "t3.small" '
            if .containerDefinitions[0].environment then
              .containerDefinitions[0].environment = (.containerDefinitions[0].environment | map(select(.name != "JAVA_OPTS" and .name != "SPRING_PROFILES_ACTIVE" and .name != "PROJECT_VERSION" and .name != "INSTANCE_TYPE"))) + [
                {"name": "JAVA_OPTS", "value": $java_opts},
                {"name": "SPRING_PROFILES_ACTIVE", "value": $profile},
                {"name": "PROJECT_VERSION", "value": $version},
                {"name": "INSTANCE_TYPE", "value": $instance_type}
              ]
            else 
              .containerDefinitions[0].environment = [
                {"name": "JAVA_OPTS", "value": $java_opts},
                {"name": "SPRING_PROFILES_ACTIVE", "value": $profile},
                {"name": "PROJECT_VERSION", "value": $version},
                {"name": "INSTANCE_TYPE", "value": $instance_type}
              ]
            end
          ' > updated-task-def.json
          mv updated-task-def.json ${{ env.ECS_TASK_DEFINITION }}
          
          echo "Task definition updated with t3.small optimized settings"

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.image_uri }}

      - name: Stop ECS service (Free Tier consideration)
        run: |
          echo "Stopping ECS service for safe deployment..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --desired-count 0
          
          echo "Waiting for service to stop..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
          
          echo "Service stopped successfully"

      - name: Deploy Amazon ECS task definition
        id: deploy-task-def
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false

      # 서비스 재시작
      - name: Start ECS service
        run: |
          echo "Starting ECS service..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --desired-count ${{ steps.current-state.outputs.current_desired_count }}
          
          echo "Waiting for service stability..."
          timeout 900 aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
          
          echo "Service started successfully"

      - name: Wait for ALB health check
        run: |
          echo "Waiting for ALB health check..."
          
          MAX_ATTEMPTS=20
          ATTEMPT=1
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS"
          
            # ALB 헬스체크 상태 확인
            HEALTHY_TARGETS=$(aws elbv2 describe-target-health \
              --target-group-arn $(aws elbv2 describe-target-groups \
                --names ozang-targets-instance \
                --query 'TargetGroups[0].TargetGroupArn' \
                --output text) \
              --query 'length(TargetHealthDescriptions[?TargetHealth.State==`healthy`])' \
              --output text)
          
            echo "Healthy targets: $HEALTHY_TARGETS"
          
            if [ "$HEALTHY_TARGETS" -gt 0 ]; then
              echo "ALB health check passed!"
              break
            fi
          
            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "ALB health check timeout"
              exit 1
            fi
          
            echo "Waiting 30 seconds before retry..."
            sleep 30
            ATTEMPT=$((ATTEMPT + 1))
          done

      - name: Verify deployment
        id: verify-deployment
        run: |
          echo "Verifying deployment..."

          # ALB HTTPS로 직접 헬스체크
          echo "Testing application via ALB HTTPS..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            --retry 3 \
            --retry-delay 10 \
            --insecure \
            https://${{ env.ALB_DNS }}/actuator/health || echo "000")

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Application is healthy and accessible via ALB"
            echo "deployment_status=success" >> $GITHUB_OUTPUT
          else
            echo "Application health check failed"
            echo "deployment_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

          # ECS 태스크 상태 확인
          RUNNING_TASKS=$(aws ecs list-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service-name ${{ env.ECS_SERVICE }} \
            --desired-status RUNNING \
            --query 'length(taskArns)')

          echo "Running tasks: $RUNNING_TASKS"

          if [ "$RUNNING_TASKS" -gt 0 ]; then
            echo "ECS tasks are running successfully"
          else
            echo "No running ECS tasks found"
            exit 1
          fi

      - name: Rollback on failure
        if: failure() && steps.current-state.outputs.current_task_def != ''
        run: |
          echo "Deployment failed. Rolling back to previous version..."
          echo "Previous task definition: ${{ steps.current-state.outputs.current_task_def }}"
          
          # 이전 태스크 정의로 롤백
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ steps.current-state.outputs.current_task_def }} \
            --desired-count ${{ steps.current-state.outputs.current_desired_count }} \
            --force-new-deployment
          
          echo "Waiting for rollback to complete..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
          
          echo "Rollback completed successfully"

      - name: Deployment notification
        if: always()
        run: |
          echo "================================================"
          echo "ECS 배포 결과"
          echo "================================================"
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Version: ${{ env.VERSION }}"
          echo "Git Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Instance Type: t3.small (2 vCPU, 2GB RAM)"
          echo "ALB DNS: ${{ env.ALB_DNS }}"
          echo "================================================"
          
          if [ "${{ job.status }}" == "success" ]; then
            echo "배포가 성공적으로 완료되었습니다!"
            echo "이미지: ${{ needs.build-and-push.outputs.image_uri }}"
            echo "상태: ${{ steps.verify-deployment.outputs.deployment_status }}"
            echo "접속 URL: http://${{ env.ALB_DNS }}"
          
            # 배포 성공시 이전 이미지 정리 (퍼블릭 ECR용, 최대 5개 유지)
            echo "Cleaning up old images in Public ECR..."
            aws ecr-public describe-images \
              --repository-name ${{ env.ECR_REPOSITORY }} \
              --region us-east-1 \
              --query 'sort_by(imageDetails,&imagePushedAt)[:-5].[imageDigest]' \
              --output text | \
            while read digest; do
              if [ -n "$digest" ] && [ "$digest" != "None" ]; then
                aws ecr-public batch-delete-image \
                  --repository-name ${{ env.ECR_REPOSITORY }} \
                  --region us-east-1 \
                  --image-ids imageDigest=$digest || true
              fi
            done
          else
            echo "배포가 실패했습니다!"
            echo "실패 이유를 확인하고 다시 시도해주세요."
          
            if [ "${{ steps.current-state.outputs.current_task_def }}" != "" ]; then
              echo "이전 버전으로 롤백되었습니다."
            fi
          fi

      - name: Collect deployment metrics
        if: always()
        run: |
          echo "================================================"
          echo "배포 메트릭"
          echo "================================================"
          
          # ECS 서비스 상태
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].{
              Status: status,
              RunningCount: runningCount,
              PendingCount: pendingCount,
              DesiredCount: desiredCount,
              TaskDefinition: taskDefinition
            }' \
            --output table
          
          # ALB 대상 그룹 상태
          echo "ALB Target Group Health:"
          aws elbv2 describe-target-health \
            --target-group-arn $(aws elbv2 describe-target-groups \
              --names ozang-targets-instance \
              --query 'TargetGroups[0].TargetGroupArn' \
              --output text) \
            --query 'TargetHealthDescriptions[].{
              Target: Target.Id,
              Port: Target.Port,
              Health: TargetHealth.State,
              Reason: TargetHealth.Reason
            }' \
            --output table
          
          echo "================================================"
          echo "최적화 정보: t3.small (2vCPU, 2GB RAM)"
          echo "Version: ${{ env.VERSION }}"
          echo "================================================"