name: CD - Deploy Batch Application To ECS

on:
  push:
    branches: [ 'batch*', 'batch-*', 'release*', 'release-*' ]
    paths:
      - 'ozang-batch/**'
      - 'ozang-core/**'
      - '.github/workflows/batch-deploy.yml'
      - '.aws/batch-task-definition.json'
      - 'settings.gradle'
      - 'build.gradle'

  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment (bypass cache)'
        required: false
        default: 'false'
        type: boolean
      version_tag:
        description: 'Version tag (optional)'
        required: false
        default: ''
        type: string

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: public.ecr.aws/o8x2e2q0
  ECR_REPOSITORY: ozang-batch
  ECS_SERVICE: ozang-batch-service
  ECS_CLUSTER: ozang-cluster2
  ECS_TASK_DEFINITION: .aws/batch-task-definition.json
  CONTAINER_NAME: ozang-batch-app
  JAVA_OPTS: "-Xmx1024m -Xms512m -XX:MaxMetaspaceSize=256m -XX:MetaspaceSize=128m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseCompressedOops -XX:+UseCompressedClassPointers -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heapdump.hprof -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=25.0"
  SPRING_PROFILES_ACTIVE: "batch,prod"

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Build and Push Batch App to ECR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.extract_version.outputs.VERSION }}
      image_uri: ${{ steps.final-image.outputs.image }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Extract Version from build.gradle
        id: extract_version
        run: |
          VERSION=$(grep "version = " build.gradle | sed "s/version = '\(.*\)'/\1/")
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Batch Application JAR (Skip Test)
        run: |
          echo "Building Batch Application with multi-module structure..."
          ./gradlew clean :ozang-batch:build -x test --no-daemon --quiet
          
          # 빌드 결과 확인
          ls -la ozang-batch/build/libs/
          echo "Batch Application JAR built successfully"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR Public
        id: login-ecr
        run: |
          aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
          echo "registry=public.ecr.aws/o8x2e2q0" >> $GITHUB_OUTPUT
          echo "Successfully logged in to Public ECR"

      - name: Check for existing image in Public ECR
        id: check-image
        if: github.event.inputs.force_deploy != 'true'
        continue-on-error: true
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr-public describe-images \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-ids imageTag=${IMAGE_TAG} \
            --region us-east-1 > /dev/null 2>&1; then
            echo "image_exists=true" >> $GITHUB_OUTPUT
            echo "IMAGE EXISTS: ${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          else
            echo "image_exists=false" >> $GITHUB_OUTPUT
            echo "🔨 IMAGE NOT FOUND: Building new batch application image"
          fi

      - name: Build, tag, and push batch app image to Amazon ECR
        id: build-image
        if: steps.check-image.outputs.image_exists != 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image for t3.small deployment (Batch Application)"
          echo "Build environment: GitHub Actions"
          echo "Target platform: linux/amd64"
          echo "Instance specs: t3.small (2 vCPU, 2GB RAM)"
          
          CACHE_FLAG=""
          if [ "${{ github.event.inputs.force_deploy }}" = "true" ]; then
            CACHE_FLAG="--no-cache"
            echo "Force deploy enabled: Building without cache"
          else
            echo "Using build cache for faster build"
          fi
          
          docker build \
            --file ozang-batch/Dockerfile \
            --build-arg VERSION=${{ env.VERSION }} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VCS_REF=${{ github.sha }} \
            --platform linux/amd64 \
            --progress=plain \
            ${CACHE_FLAG} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.VERSION }} \
            --label "instance-type=t3.small" \
            --label "application-type=batch-app" \
            --label "cpu=2-vcpu" \
            --label "memory=2gb" \
            --label "git-commit=${{ github.sha }}" \
            --label "version=${{ env.VERSION }}" \
            --label "build-date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            .

          echo "Pushing images to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.VERSION }}
          
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          
          # 이미지 크기 및 정보 확인
          IMAGE_SIZE=$(docker images $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG --format "{{.Size}}")
          echo "Built batch app image size: ${IMAGE_SIZE}"
          echo "Image tags:"
          echo "  - $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "  - $ECR_REGISTRY/$ECR_REPOSITORY:latest" 
          echo "  - $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.VERSION }}"

      - name: Use existing image from Public ECR
        id: use-existing-image
        if: steps.check-image.outputs.image_exists == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "image=${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Using existing batch app image: ${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"

      - name: Set final image URI
        id: final-image
        run: |
          IMAGE_URI="${{ steps.build-image.outputs.image || steps.use-existing-image.outputs.image }}"
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "Final batch app image URI: $IMAGE_URI"

  deploy:
    name: Deploy Batch App to ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 25
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version from build job
        run: |
          echo "VERSION=${{ needs.build-and-push.outputs.version }}" >> $GITHUB_ENV
          echo "Version: ${{ needs.build-and-push.outputs.version }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if service exists
        id: check-service
        run: |
          if aws ecs describe-services --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE }} > /dev/null 2>&1; then
            echo "service_exists=true" >> $GITHUB_OUTPUT
            echo "Batch service exists. Will update."
          else
            echo "service_exists=false" >> $GITHUB_OUTPUT
            echo "Batch service does not exist. Will create new service."
          fi

      - name: Get current deployment state
        id: current-state
        if: steps.check-service.outputs.service_exists == 'true'
        run: |
          echo "Checking current ECS batch service state..."
          
          # 현재 태스크 정의 ARN 저장 (롤백용)
          CURRENT_TASK_DEF=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "current_task_def=${CURRENT_TASK_DEF}" >> $GITHUB_OUTPUT
          echo "Current batch task definition: ${CURRENT_TASK_DEF}"
          
          # 현재 실행 중인 태스크 수 저장
          CURRENT_DESIRED_COUNT=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].desiredCount' \
            --output text)
          echo "current_desired_count=${CURRENT_DESIRED_COUNT}" >> $GITHUB_OUTPUT
          echo "Current desired count: ${CURRENT_DESIRED_COUNT}"

      - name: Update Task Definition with Environment Variables
        run: |
          echo "Updating batch task definition with environment variables..."
          
          cat ${{ env.ECS_TASK_DEFINITION }} | jq --arg java_opts "${{ env.JAVA_OPTS }}" \
            --arg profile "${{ env.SPRING_PROFILES_ACTIVE }}" \
            --arg version "${{ env.VERSION }}" \
            --arg instance_type "t3.small" '
            if .containerDefinitions[0].environment then
              .containerDefinitions[0].environment = (.containerDefinitions[0].environment | map(select(.name != "JAVA_OPTS" and .name != "SPRING_PROFILES_ACTIVE" and .name != "PROJECT_VERSION" and .name != "INSTANCE_TYPE"))) + [
                {"name": "JAVA_OPTS", "value": $java_opts},
                {"name": "SPRING_PROFILES_ACTIVE", "value": $profile},
                {"name": "PROJECT_VERSION", "value": $version},
                {"name": "INSTANCE_TYPE", "value": $instance_type}
              ]
            else 
              .containerDefinitions[0].environment = [
                {"name": "JAVA_OPTS", "value": $java_opts},
                {"name": "SPRING_PROFILES_ACTIVE", "value": $profile},
                {"name": "PROJECT_VERSION", "value": $version},
                {"name": "INSTANCE_TYPE", "value": $instance_type}
              ]
            end
          ' > updated-batch-task-def.json
          mv updated-batch-task-def.json ${{ env.ECS_TASK_DEFINITION }}
          
          echo "Batch task definition updated with t3.small optimized settings"

      - name: Fill in the new image ID in the batch task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.image_uri }}
          environment-variables: |
            JAVA_OPTS=${{ env.JAVA_OPTS }}
            SPRING_PROFILES_ACTIVE=${{ env.SPRING_PROFILES_ACTIVE }}
            PROJECT_VERSION=${{ env.VERSION }}

      - name: Stop batch service (if exists)
        if: steps.check-service.outputs.service_exists == 'true'
        run: |
          echo "Stopping batch service for safe deployment..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --desired-count 0
          
          echo "Waiting for batch service to stop..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
          
          echo "Batch service stopped successfully"

      - name: Deploy batch task definition
        id: deploy-task-def
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify deployment
        run: |
          echo "🚀 Batch Application deployment completed!"
          echo "✅ Service: ${{ env.ECS_SERVICE }}"
          echo "✅ Cluster: ${{ env.ECS_CLUSTER }}"
          echo "✅ Image: ${{ needs.build-and-push.outputs.image_uri }}"
          echo "✅ Version: ${{ env.VERSION }}"
          echo "✅ Instance: t3.small (2 vCPU, 2GB RAM)"
          echo "✅ Application Type: Batch Application"
          
          # 서비스 상태 확인
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].deployments[0].{Status:status,TaskDefinition:taskDefinition,RunningCount:runningCount,DesiredCount:desiredCount}' \
            --output table
          
          echo ""
          echo "📊 Monitor deployment: AWS Console → ECS → ${{ env.ECS_CLUSTER }} → ${{ env.ECS_SERVICE }}"
          echo "📝 Batch jobs will run according to the configured schedule"