dependencies {
    // Core 모듈 의존성
    implementation project(':ozang-core')

    // Batch 관련 (핵심 의존성)
    implementation 'org.springframework.boot:spring-boot-starter-batch'

    // Web (배치 관리 API용 - 경량)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Retry & AOP
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Test
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'com.h2database:h2'
}

springBoot {
    buildInfo()
    mainClass = 'com.fourthread.ozang.OzangBatchApplication'
}

// JAR 실행시 배치 프로필 자동 활성화
bootRun {
    systemProperty 'spring.profiles.active', 'batch,local'
}

// 배치 전용 테스트 태스크
tasks.register('batchTest', Test) {
    useJUnitPlatform {
        includeTags 'batch'
    }
    systemProperty 'spring.profiles.active', 'batch,test'
}