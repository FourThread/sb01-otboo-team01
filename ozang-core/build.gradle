// ozang-core 모듈 전용 설정
// java-library 플러그인은 루트 build.gradle에서 적용됨
// 대부분의 설정은 루트 build.gradle에서 관리됨

description = 'Core shared components between app and batch'

// QueryDSL 추가 설정
def querydslDir = "src/main/generated"

sourceSets {
    main {
        java {
            srcDirs += [querydslDir]
        }
    }
}

// QueryDSL 컴파일 설정
compileJava {
    dependsOn('clean')
    options.getGeneratedSourceOutputDirectory().set(file(querydslDir))
}

// QueryDSL 생성 파일 정리
clean {
    delete file(querydslDir)
}

// Core 모듈은 실행 가능한 JAR가 아니므로 plain JAR 생성
jar {
    enabled = true
    archiveClassifier = ''
}

// Core 모듈 전용 테스트 태스크
tasks.register('coreUnitTest', Test) {
    description = 'Run unit tests for core module'
    useJUnitPlatform {
        excludeTags 'integration'
        includeTags 'core'
    }
}

// Core 모듈의 API 변경 사항 검증 (선택사항)
tasks.register('verifyApi') {
    description = 'Verify that core module API is backward compatible'
    doLast {
        println "Core module API verification completed"
        // 실제 API 호환성 검증 로직 추가 가능
    }
}

// 의존성 분석 태스크
tasks.register('analyzeDependencies') {
    description = 'Analyze dependencies for core module'
    doLast {
        configurations.implementation.resolvedConfiguration.resolvedArtifacts.each {
            println "Core dependency: ${it.moduleVersion.id}"
        }
    }
}