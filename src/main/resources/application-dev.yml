spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ozang_db
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      ssl:
        enabled: false
        timeout: 2000ms
        lettuce:
          pool:
            max-active: 8
            max-idle: 8
            min-idle: 0
            max-wait: 1000ms
          shutdown-timeout: 100ms

  elasticsearch:
    uris: ${ELASTICSEARCH_HOST}
    username: ${ELASTICSEARCH_USERNAME}
    password: ${ELASTICSEARCH_PASSWORD}
    connection-timeout: 10s
    socket-timeout: 60s

elasticsearch:
  enabled: ${ELASTICSEARCH_ENABLED:true}
  cloud:
    host: ${ELASTICSEARCH_HOST}
    api-key: ${ELASTICSEARCH_API_KEY}

batch:
  weather:
    retention-days: 3
  scheduler:
    weather-cleanup:
      enabled: true
    token-cleanup:
      enabled: true
  job:
    enabled: false
  jdbc:
    initialize-schema: embedded

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    redis:
      enabled: true
    elasticsearch:
      enabled: ${elasticsearch.enabled:false}
    # 로컬에서 Redis 연결 실패 시 애플리케이션 전체를 DOWN으로 표시하지 않음
    defaults:
      enabled: true
    db:
      enabled: true
    diskspace:
      enabled: true
    ping:
      enabled: true

logging:
  level:
    root: INFO
    com.fourthread.ozang: DEBUG
    org.springframework.web: DEBUG
    org.springframework.batch: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.data.redis: DEBUG
    io.lettuce.core: INFO
    # ↓ 소켓 핸드셰이크·프레임 처리
    org.springframework.web.socket: DEBUG
    org.springframework.web.socket.server: DEBUG
    org.springframework.web.socket.client: DEBUG
    # ↓ STOMP 메시지 라우팅·브로커
    org.springframework.messaging.simp: TRACE
    org.springframework.web.socket.messaging: TRACE
    org.springframework.messaging.support: TRACE
    # ↓ SockJS fallback 사용 시
    org.springframework.web.socket.sockjs: DEBUG
cloud:
  aws:
    s3:
      bucket: ozang-dev-bucket

file:
  upload:
    clothes:
      path: dev/clothes/images/
      allowed-extensions: jpg,jpeg,png,gif,webp
      max-size: 10485760
    profiles:
      path: dev/profiles/images/
      allowed-extensions: jpg,jpeg,png,gif,webp
      max-size: 10485760

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ozang-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer