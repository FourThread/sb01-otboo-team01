services:
  batch-app:
    build:
      context: .
      dockerfile: ozang-batch/Dockerfile
      platforms:
        - linux/amd64
    platform: linux/amd64
    container_name: o-zang-batch
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=batch
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    ports:
      - "8081:8081"
    depends_on:
      - db
      - redis

  db:
    image: postgres:latest
    platform: linux/amd64
    container_name: postgres-batch
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pgdata_batch:/var/lib/postgresql/data

  redis:
    image: redis:7
    platform: linux/amd64
    container_name: redis-batch
    restart: unless-stopped
    command: ["redis-server", "--databases", "16"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata_batch:/data

volumes:
  pgdata_batch:
  redisdata_batch: